<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The hospital's own leaf mark, cut from logo.png. The wordmark is
         unreadable at 32px, so the icon is the mark alone — which is what the
         hospital uses small on its own signage. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0e6a5c" />

    <!--
      Do not let the browser translate this page.

      The site is written in English, Tamil and Hindi by people, and carries its
      own switcher. Chrome sees `lang="ta"`, decides a reader whose browser is
      set to English needs help, and machine-translates the whole page back over
      the top of the human translation.

      The result is worse than the original in every way. "Now accepting online
      appointments" — written as such in English, and translated properly into
      Tamil — comes back through the machine as "Online meeting registration has
      begun". A department called Paediatrics & Neonatology becomes "Child Health
      and Infant Care". Even the language buttons are rewritten: தமிழ் and हिंदी
      turn into "Tamil" and "Hindi", so the one control that would let the reader
      fix it no longer looks like itself.

      On a hospital site the stakes are not only aesthetic. Machine translation
      of a department name, a drug, or an instruction about when to come in is
      not something anyone here has checked, and it appears with no indication
      that a machine wrote it.

      So: this page declines translation. The reader still has three languages —
      ours, correct, one click away.
    -->
    <meta name="google" content="notranslate" />
    <meta
      name="description"
      content="Deepan Hospital — book appointments with our doctors online. தீபன் மருத்துவமனை — மருத்துவரிடம் சந்திப்பு பதிவு செய்யுங்கள்."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&family=Noto+Sans+Tamil:wght@400..700&family=Noto+Serif+Tamil:wght@400..700&family=Noto+Sans+Devanagari:wght@400..700&family=Noto+Serif+Devanagari:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <title>Deepan Hospital · தீபன் மருத்துவமனை</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
